<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Crousty Game</title>

  <link rel="stylesheet" href="style.css">

  <script defer type="module" src="main.js"></script>
</head>

<body>

  <!-- FOND -->
  <div class="background"></div>

  <!-- PERSONNAGE -->
  <img
    class="bird"
    src="/img/logo.png"
    alt="Crousty Game"
  >

  <!-- ACCUEIL -->
  <div class="message" id="welcomeScreen">

    <div class="game-logo">
      CROUSTY GAME
    </div>

    <div class="game-subtitle">
      Fais le meilleur score !
    </div>

    <div class="user-info">

      <input
        type="text"
        id="firstName"
        placeholder="Prénom *"
        autocomplete="given-name"
        required
      >

      <input
        type="text"
        id="lastName"
        placeholder="Nom *"
        autocomplete="family-name"
        required
      >

      <input
        type="email"
        id="email"
        placeholder="E-mail *"
        autocomplete="email"
        required
      >

      <input
        type="tel"
        id="phone"
        placeholder="Téléphone *"
        autocomplete="tel"
        required
      >

      <label class="consent-line">
        <input
          type="checkbox"
          id="consentGame"
        >

        <span>
          J'accepte le règlement du jeu et la politique de confidentialité.
        </span>
      </label>

      <label class="consent-line">
        <input
          type="checkbox"
          id="consentMarketing"
        >

        <span>
          J'accepte de recevoir les offres et actualités de Crousty.
        </span>
      </label>

    </div>

    <button id="loginBtn">
      JOUER
    </button>

    <div class="game-info">
      3 parties pour réaliser ton meilleur score
    </div>

  </div>

  <!-- GAME OVER -->
  <div class="message2"></div>

  <!-- BOUTON REJOUER -->
  <button
    id="replayBtn"
    class="replay-btn"
  >
    REJOUER
  </button>

  <!-- SCORE / CLASSEMENT -->
  <div class="score">

    <span class="score_title"></span>

    <span class="score_val"></span>

    <ul class="ranking"></ul>

  </div>

</body>
</html>
