<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Crousty Game</title>

  <link rel="stylesheet" href="style.css">

  <script defer type="module" src="main.js"></script>
</head>

<body>

  <!-- FOND -->
  <div class="background"></div>

  <!-- PERSONNAGE -->
  <img
    class="bird"
    src="/img/logo.png"
    alt="Crousty Game"
  >

  <!-- ACCUEIL -->
  <div class="message" id="welcomeScreen">

    <div class="game-logo">
      CROUSTY GAME
    </div>

    <div class="game-subtitle">
      Fais le meilleur score !
    </div>

    <div class="user-info">

      <input
        type="text"
        id="firstName"
        placeholder="Prénom *"
        autocomplete="given-name"
        required
      >

      <input
        type="text"
        id="lastName"
        placeholder="Nom *"
        autocomplete="family-name"
        required
      >

      <input
        type="email"
        id="email"
        placeholder="E-mail *"
        autocomplete="email"
        required
      >

      <input
        type="tel"
        id="phone"
        placeholder="Téléphone *"
        autocomplete="tel"
        required
      >

      <label class="consent-line">
        <input
          type="checkbox"
          id="consentGame"
        >

        <span id="gameConsentText">
          J'accepte le règlement du jeu et la politique de confidentialité.
        </span>
      </label>

      <label class="consent-line">
        <input
          type="checkbox"
          id="consentMarketing"
        >

        <span id="marketingText">
          J'accepte de recevoir les offres et actualités de Crousty.
        </span>
      </label>

    </div>

    <button id="loginBtn">
      JOUER
    </button>

    <div class="game-info">
      3 parties pour réaliser ton meilleur score
    </div>

  </div>

  <!-- GAME OVER -->
  <div class="message2"></div>

  <div id="countdown" class="countdown" hidden>
    <div class="countdown-panel">
      <p>PRÊT ?</p>
      <strong id="countdownValue" role="status" aria-live="polite">3</strong>
      <p>Touche l’écran pour voler<br><small>Sur ordinateur : espace ou flèche ↑</small></p>
    </div>
  </div>

  <!-- BOUTON REJOUER -->
  <button
    id="replayBtn"
    class="replay-btn"
  >
    REJOUER
  </button>

  <!-- SCORE / CLASSEMENT -->
  <div class="score">

    <span class="score_title"></span>

    <span class="score_val"></span>

  </div>

  <section id="rankingScreen" class="ranking-screen" aria-labelledby="rankingTitle" hidden>
    <h1 id="rankingTitle" tabindex="-1">🏆 TOP 10 CROUSTY</h1>
    <p id="bestScore" class="best-score"></p>
    <p class="ranking-caption">Tes 3 parties sont terminées. Merci d’avoir joué !</p>
    <ul class="ranking" aria-label="Les dix meilleurs scores"></ul>
    <p id="rankingStatus" role="status"></p>
    <button id="rankingRetry" type="button" hidden>RÉESSAYER</button>
  </section>

</body>
</html>
