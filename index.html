<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />

    <title>Crousty Game</title>

    <link rel="stylesheet" href="style.css" />

    <script defer type="module" src="main.js"></script>
  </head>

  <body>

    <!-- Fond du jeu -->
    <div class="background"></div>

    <!-- Personnage -->
    <img
      class="bird"
      src="/img/logo.png"
      alt="Crousty Game"
    />

    <!-- Écran d'accueil -->
    <div class="message" id="welcomeScreen">

      <div class="game-logo">
        CROUSTY GAME
      </div>

      <div class="game-subtitle">
        Fais le meilleur score !
      </div>

      <div class="user-info">

        <input
          type="text"
          id="firstName"
          placeholder="Prénom *"
          required
          autocomplete="given-name"
          inputmode="text"
        />

        <input
          type="text"
          id="lastName"
          placeholder="Nom *"
          required
          autocomplete="family-name"
          inputmode="text"
        />

        <input
          type="email"
          id="email"
          placeholder="E-mail *"
          required
          autocomplete="email"
          inputmode="email"
        />

        <input
          type="tel"
          id="phone"
          placeholder="Téléphone *"
          required
          autocomplete="tel"
          inputmode="tel"
        />

        <label class="consent-line">
          <input
            type="checkbox"
            id="consentGame"
            required
          />

          <span>
            J'accepte le règlement du jeu et la politique de confidentialité.
          </span>
        </label>

        <label class="consent-line">
          <input
            type="checkbox"
            id="consentMarketing"
          />

          <span>
            J'accepte de recevoir les offres et actualités de Crousty.
          </span>
        </label>

      </div>

      <button id="loginBtn">
        JOUER
      </button>

      <div class="game-info">
        3 parties pour réaliser ton meilleur score
      </div>

    </div>

    <!-- Message Game Over -->
    <div class="message2"></div>

    <!-- Score -->
    <div class="score">

      <span class="score_title"></span>

      <span class="score_val"></span>

      <!-- Leaderboard -->
      <ul class="ranking"></ul>

    </div>

  </body>
</html>
